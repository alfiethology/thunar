name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04-amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - target: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
          - target: debian-13-amd64
            runner: ubuntu-24.04
            image: debian:13
          - target: fedora-44-x86_64
            runner: ubuntu-24.04
            image: fedora:44
          - target: archlinux-x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and package in the target distribution
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e TARGET -e RELEASE_TAG \
            "$IMAGE" bash .github/scripts/build-linux.sh
      - name: Check installation in a clean container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" "$IMAGE" bash -euc '
            source /etc/os-release
            case "$ID" in
              ubuntu|debian)
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb
                ;;
              fedora) dnf install -y /packages/*.rpm ;;
              arch)
                pacman -Syu --noconfirm
                mapfile -t dependencies < <(bsdtar -xOf /packages/*.pkg.tar.zst .PKGINFO | sed -n "s/^depend = //p")
                pacman -S --needed --noconfirm "${dependencies[@]}"
                pacman -U --noconfirm /packages/*.pkg.tar.zst
                ;;
            esac
            thunar --version
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS 15 Apple Silicon (experimental)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Apple Silicon package with MacPorts dependencies
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bash .github/scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-15-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add checksums and installation instructions
        run: |
          cp .github/RELEASING.md dist/INSTALL.md
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --draft --title "Thunar $RELEASE_TAG" \
              --notes-file .github/RELEASING.md
          fi
